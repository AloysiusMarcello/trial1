# Render Blueprint for Overlap: a free web service running server.js. Events are kept in a free Neon Postgres
# database whose connection string is entered as DATABASE_URL in the dashboard, because Render deletes its own
# free databases 30 days after creation (the free web service's own disk is wiped whenever it restarts).
services:
  - type: web
    name: overlap
    runtime: node
    plan: free
    branch: overlap
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_URL
        sync: false
      # one-time move from the old Render database; remove this and the databases section once the log
      # says "Copied ... events"
      - key: COPY_FROM_DATABASE_URL
        fromDatabase:
          name: overlap-db
          property: connectionString

databases:
  - name: overlap-db
    plan: free
