<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlap · find a time that works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --bg:#050505; --panel:#151515; --raised:#232323; --raised-2:#2E2E2E; --muted:#A3A3A8; --dim:#8A8A90;
  --lime:#E4F65A; --lav:#B5A6F5; --violet:#5A41D8; --pink:#F9C9F4; --pink-ink:#8F1480;
  --ink:#0B0B0B; --ink-2:#3F3F48; --ink-3:#5C5C66; --cell:#EFEDF5; --hair:#E4E3EA;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#fff;font-family:"Red Hat Display","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
h1{font-size:32px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
h2{font-size:19px;font-weight:600;overflow-wrap:anywhere}
button,input,select{font:inherit}
button{cursor:pointer;border:0;padding:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.side :focus-visible{outline-color:var(--lime)}
[hidden]{display:none!important}

#app{min-height:100vh;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px}
.main{flex:999 1 560px;min-width:0;border-radius:28px;padding:28px;color:var(--ink);display:flex;flex-direction:column;gap:22px;
  background:radial-gradient(110% 80% at 0% 0%,var(--lime) 0%,transparent 58%),linear-gradient(180deg,#D7E8EA 0%,#CFDCF1 55%,#C4B5F4 100%)}

/* dark sidebar panels */
.panel{background:var(--panel);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sub{font-size:13px;line-height:1.5;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.brand{flex-direction:row;align-items:center;gap:14px;padding:14px}
.logo{width:52px;height:52px;flex:none;border-radius:16px;background:var(--lav);display:grid;place-items:center}
.brand-text{flex:1;min-width:0;display:flex;flex-direction:column}
.brand-text strong{font-size:18px;font-weight:600}
.brand-text span{font-size:13px;color:var(--muted)}
.tile-btn{width:52px;height:52px;flex:none;border-radius:16px;background:var(--raised);color:#fff;display:grid;place-items:center}
.tile-btn:hover,.chip-btn:hover{background:var(--raised-2)}
.chip-btn{height:40px;padding:0 14px;border-radius:20px;background:var(--raised);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}

/* segmented control */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(11,11,11,.1)}
.seg button{min-height:44px;padding:0 20px;border-radius:11px;font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap}
.seg button.on{background:#fff}
.seg.dark{background:var(--raised)}
.seg.dark button{flex:1 1 0;padding:0 8px;font-size:14px;color:#fff}
.seg.dark button.on{color:var(--ink)}

/* date picker */
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head strong{flex:1;font-size:17px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center}
.icon-btn:hover{background:var(--raised)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-dow span{text-align:center;font-size:13px;font-weight:600}
.cal-grid{user-select:none;-webkit-user-select:none}
.day{height:40px;border-radius:20px;font-size:14px;font-weight:500;color:#fff;touch-action:none}
.day.out{color:var(--dim)}
.day.today{box-shadow:inset 0 0 0 1px var(--lime)}
.day:hover{background:var(--raised)}
.day.on{background:var(--lime);color:var(--ink);box-shadow:none}
.dow-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow-btn{height:56px;border-radius:16px;background:var(--raised);color:#fff;font-size:14px;font-weight:600}
.dow-btn.on{background:var(--lime);color:var(--ink)}

/* sign in, people, events */
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.side input{height:46px;width:100%;min-width:0;padding:0 14px;border:1px solid #2F2F2F;border-radius:14px;background:#0D0D0D;color:#fff;font-size:15px}
.side input::placeholder{color:var(--dim)}
.btn-lime{min-height:48px;border-radius:14px;background:var(--lime);color:var(--ink);font-size:15px;font-weight:600}
.btn-lime:hover{background:#EEFB7E}
.err{font-size:13px;font-weight:600;color:#FFB4A8}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink)}
.avatar.big{width:44px;height:44px;font-size:16px}
.who{display:flex;flex-direction:column;min-width:0}
.who strong{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--raised);display:inline-grid;place-items:center;font-size:13px;font-weight:600}
.people,.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.people li{display:flex;align-items:center;gap:12px}
.p-name{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-status{font-size:12px;color:var(--muted);white-space:nowrap}
.people li.busy{opacity:.5}
.people li.busy .p-name{text-decoration:line-through}
.people li.free .p-status{color:var(--lime)}
.events{gap:4px;margin:0 -8px}
.events li{display:flex;align-items:center;gap:4px}
.ev{flex:1;min-width:0;min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:#fff;text-decoration:none}
.ev:hover,.ev.cur{background:var(--raised)}
.dot{width:10px;height:10px;flex:none;border-radius:50%}
.ev-text{min-width:0;display:flex;flex-direction:column}
.ev-name{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-meta{font-size:12px;color:var(--muted)}
.x{width:40px;height:40px;flex:none;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.x:hover{background:var(--raised);color:#fff}
.import{display:flex;gap:8px;align-items:flex-end}
.import label{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.import .chip-btn{height:46px;border-radius:14px}

/* main panel */
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.title-wrap{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-2)}
.title-input{width:100%;font-size:32px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:2px solid rgba(11,11,11,.28);border-radius:0;padding:2px 0 8px}
.title-input::placeholder{color:rgba(11,11,11,.5)}
.btn-black{min-height:52px;padding:0 28px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.btn-black:hover{background:#2A2A2A}
.head-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.between{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.sub-ink{font-size:14px;line-height:1.5;color:var(--ink-2)}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.field select{height:48px;min-width:150px;max-width:100%;padding:0 12px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.alert{background:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;color:#9B1C1C}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.tag.pink{background:var(--pink);color:var(--pink-ink)}
.empty{background:rgba(255,255,255,.55);border-radius:24px;padding:40px 24px;text-align:center;font-size:15px;color:var(--ink-2)}
#preview{display:flex;flex-direction:column;gap:14px}

/* availability boards */
.boards{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.board{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:12px}
.board-head{min-height:96px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .scale{gap:3px}
.sw{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(11,11,11,.12)}
#readout.live{font-weight:600;color:var(--ink)}
.scroll{overflow-x:auto;padding-bottom:4px}
.grid{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;padding-right:14px}
.tz-chip{width:52px;height:64px;flex:none;border-radius:16px;background:var(--lime);display:grid;place-items:center}
.tz-chip span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700}
.chip{flex:1 0 44px;min-width:0;height:64px;border-radius:16px;background:rgba(255,255,255,.42);color:#26262E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip small{font-size:12px;font-weight:500}
.chip b{font-size:22px;font-weight:600;line-height:1}
.chip.dow b{font-size:16px}
button.chip:hover{background:rgba(255,255,255,.72)}
button.chip.full{background:#fff;color:var(--violet)}
.card{background:#fff;border-radius:24px;padding:20px 14px 20px 0;user-select:none;-webkit-user-select:none}
.r{display:flex;gap:6px;height:16px}
.r.gap{margin-top:14px}
.r.end{height:0}
.lab{width:52px;flex:none;position:relative}
.lab span{position:absolute;right:8px;top:-8px;font-size:12px;line-height:16px;color:var(--ink-3);white-space:nowrap}
.cell{flex:1 0 44px;min-width:0;height:16px;background:var(--cell)}
.cell.none{background:transparent}
.cell.h{box-shadow:inset 0 1px 0 rgba(11,11,11,.18)}
.cell.hh{box-shadow:inset 0 1px 0 rgba(11,11,11,.07)}
.cell.top{border-radius:8px 8px 0 0}
.cell.bot{border-radius:0 0 8px 8px}
.cell.top.bot{border-radius:8px}
.cell.on{background:var(--lav)}
button.cell:hover,button.tile:hover,.hot{outline:2px solid var(--ink);outline-offset:-2px}
[data-g="mine"]{touch-action:none}
.locked .card,.locked .chips{opacity:.55}
.pv-row{display:flex;gap:6px;height:40px}
.pv-row.end{height:1px}
.pv-line{flex:1;border-top:1px solid var(--hair)}
.tiles{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tile{height:96px;border-radius:18px;background:var(--cell);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tile .t-dow{font-size:13px}
.tile .t-num{font-size:28px;font-weight:600;line-height:1}
.tile.dow .t-num{font-size:20px}
.tile .t-sub{font-size:12px}
.tile.on{background:var(--lav)}

#toast{position:fixed;left:50%;bottom:24px;max-width:calc(100vw - 32px);transform:translate(-50%,16px);background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:923px){ /* stacked: keep the grids right under sign-in, people and saved events after */
  .side{display:contents}
  .side>*{flex:1 1 100%}
  .main{order:2;flex:1 1 100%}
  .side>.after{order:3}
}
@media (max-width:600px){
  #app{padding:10px}
  .main{padding:18px;border-radius:22px}
  h1,.title-input{font-size:26px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

  var h = '<div class="scroll"><div class="grid" style="min-width:' + (66 + cols.length * 50) + 'px"><div class="chips"><div class="tz-chip" title="' + esc(d.tz) + '"><span>' + tzShort(d.tz) + '</span></div>' +
    cols.map(function (c) { return '<div class="chip' + c.cls + '">' + chipInner(c) + '</div>'; }).join('') + '</div><div class="card">';
  for (var m = d.start; m <= d.end; m += 60) h += '<div class="pv-row' + (m === d.end ? ' end' : '') + '"><div class="lab"><span>' + hourLabel(m) + '</span></div><div class="pv-line"></div></div>';
  return h + '</div></div></div>';
}

function timeGrid(ev, which) {
  var L = layout(ev, S.viewTz), mine = which === 'mine', nR = L.rowMins.length;
  var cols = L.colKeys.map(function (k) { return colInfo(k, ev.kind); });
  var h = '<div class="scroll"><div class="grid" style="min-width:' + (66 + cols.length * 50) + 'px"><div class="chips"><div class="tz-chip" title="' + esc(S.viewTz) + '"><span>' + tzShort(S.viewTz) + '</span></div>';
  cols.forEach(function (c, i) {
    h += mine ? '<button type="button" class="chip' + c.cls + '" data-act="daycol" data-c="' + i + '" aria-pressed="false" aria-label="Toggle all of ' + c.long + '">' + chipInner(c) + '</button>'
      : '<div class="chip' + c.cls + '">' + chipInner(c) + '</div>';
  });
  h += '</div><div class="card">';
  L.rowMins.forEach(function (rm, ri) {
    var gap = ri > 0 && rm - L.rowMins[ri - 1] > 15, top = ri === 0 || gap, bot = ri === nR - 1 || L.rowMins[ri + 1] - rm > 15;
    var cls = 'cell' + (rm % 60 === 0 ? ' h' : rm % 30 === 0 ? ' hh' : '') + (top ? ' top' : '') + (bot ? ' bot' : '');
    h += '<div class="r' + (gap ? ' gap' : '') + '"><div class="lab">' + (rm % 60 === 0 ? '<span>' + hourLabel(rm) + '</span>' : '') + '</div>';
    L.colKeys.forEach(function (ck, ci) {
      var key = L.cells[ck + '@' + rm];
      if (!key) { h += '<span class="cell none"></span>'; return; }
      var label = cols[ci].long + ', ' + timeLabel(rm);
      h += '<button type="button" class="' + cls + '" data-g="' + which + '" data-k="' + key + '" data-c="' + ci + '" data-r="' + ri + '" data-l="' + label + '" aria-label="' + label + '"' + (mine ? ' aria-pressed="false"' : '') + '></button>';
    });
    h += '</div>';
  });
  var endMin = nR ? L.rowMins[nR - 1] + 15 : 1;
  if (endMin % 60 === 0) h += '<div class="r end"><div class="lab"><span>' + hourLabel(endMin) + '</span></div></div>';
  return h + '</div></div></div>';
}

function tileGrid(ev, which) {
  var mine = which === 'mine';
  return '<div class="card tiles">' + ev.days.map(function (key) {
    var c = colInfo(colKeyOf(key, ev.kind), ev.kind);
    return '<button type="button" class="tile' + c.cls + '" data-g="' + which + '" data-k="' + key + '" data-l="' + c.long + '" aria-label="' + c.long + '"' + (mine ? ' aria-pressed="false"' : '') + '>' +
      tileInner(c, mine ? c.mon : (c.mon ? c.mon + ' · ' : '') + '<span class="cnt"></span>') + '</button>';
  }).join('') + '</div>';
}

function mainEvent(ev) {
  var times = ev.mode === 'times', me = mePerson(ev), n = ev.people.length, nd = ev.days.length, legend = '';
  var steps = Math.min(n, 8);
  if (!n) legend = '<i class="sw" style="background:' + heat(0, 0) + '"></i>';
  else for (var i = 0; i <= steps; i++) legend += '<i class="sw" style="background:' + heat(Math.round(i * n / steps), n) + '"></i>';
  var grid = times ? timeGrid : tileGrid;
  return '<header class="head" style="align-items:flex-start"><div class="title-wrap"><h1>' + esc(ev.name) + '</h1><div class="meta">' +
    (times ? '<span class="tag">' + timeLabel(ev.start) + ' – ' + timeLabel(ev.end) + '</span>' : '<span class="tag pink">Dates only</span>') +
    '<span>' + nd + ' ' + (ev.kind === 'dow' ? (nd === 1 ? 'day' : 'days') : (nd === 1 ? 'date' : 'dates')) + ' · ' + n + (n === 1 ? ' response' : ' responses') + '</span></div></div>' +
    '<div class="head-actions">' + (times ? '<label class="field">Your time zone<select data-field="viewtz" data-fid="f-viewtz">' + tzOptions(S.viewTz) + '</select></label>' : '') +
    '<button type="button" class="btn-black" data-act="copy" data-fid="copy">Copy invite link</button></div></header>' +
    '<p class="sub-ink">' + (REMOTE ? 'Send the invite link to your friends. Their answers show up here a few seconds after they add them.'
      : 'The invite link carries this event and every response so far. Send it along with this file. Whoever opens it can add their own availability and send a link back for you to import.') + '</p>' +
    '<div class="boards"><section class="board' + (me ? '' : ' locked') + '"><div class="board-head"><h2>' + (me ? esc(me.name) + '’s availability' : 'Your availability') + '</h2>' +
    '<div class="legend"><span><i class="sw" style="background:var(--cell)"></i>Unavailable</span><span><i class="sw" style="background:var(--lav)"></i>Available</span></div>' +
    '<p class="sub-ink">' + (!me ? 'Sign in on the left to add your availability.' : times ? 'Click and drag to toggle. Tap a day to fill the whole day. Saved immediately.' : 'Tap the dates you are free. Saved immediately.') + '</p></div>' +
    grid(ev, 'mine') + '</section>' +
    '<section class="board group-board"><div class="board-head"><h2>Group’s availability</h2>' +
    '<div class="legend"><span>0/' + n + '</span><span class="scale">' + legend + '</span><span>' + n + '/' + n + ' available</span></div>' +
    '<p class="sub-ink" id="readout" aria-live="polite"></p></div>' + grid(ev, 'group') + '</section></div>';
}

function render() {
  var ev = S.view === 'event' ? cur() : null;
  if (!ev) S.view = 'new';
  var act = document.activeElement, fid = act && act.dataset ? act.dataset.fid : null, caret = null;
  try { if (fid && typeof act.selectionStart === 'number') caret = [act.selectionStart, act.selectionEnd]; } catch (e) {}
  app.innerHTML = '<aside class="side">' + brand() + (ev ? sideEvent(ev) : sideNew()) + sideEvents() + '</aside><main class="main">' + (ev ? mainEvent(ev) : mainNew()) + '</main>';
  document.title = (ev ? ev.name + ' · ' : '') + 'Overlap';
  if (ev) paint(); else updateDraft();
  if (fid) {
    var el = app.querySelector('[data-fid="' + fid + '"]');
    if (el) { el.focus(); if (caret) try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} }
  }
}

/* ---------- in-place updates (no rebuild while dragging) ---------- */
function updateDraft() {
  var d = S.draft, n = draftDays().length, u = d.kind === 'dates' ? 'date' : 'day';
  each('[data-g="cal"]', function (el) { var on = !!d.days[el.dataset.k]; el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); });
  each('[data-act="dow"]', function (el) { var on = !!d.dow[el.dataset.v]; el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); });
  var picked = $('#picked'), err = $('#error'), pv = $('#preview');
  if (picked) picked.textContent = n ? n + ' ' + u + (n === 1 ? '' : 's') + ' selected' : 'No ' + u + 's selected yet';
  if (err) { err.hidden = !S.error; err.textContent = S.error; }
  if (pv) pv.innerHTML = previewHtml();
}
function paint() {
  var ev = cur();
  if (!ev || S.view !== 'event') return;
  var me = mePerson(ev), n = ev.people.length, counts = {};
  ev.people.forEach(function (p) { for (var k in p.slots) counts[k] = (counts[k] || 0) + 1; });
  each('[data-g="mine"]', function (el) { var on = !!(me && me.slots[el.dataset.k]); el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); });
  each('[data-g="group"]', function (el) {
    var c = counts[el.dataset.k] || 0, cnt = el.querySelector('.cnt');
    el.style.background = heat(c, n); el.style.color = heatInk(c, n);
    el.setAttribute('aria-label', el.dataset.l + ': ' + c + ' of ' + n + ' available');
    if (cnt) cnt.textContent = c + '/' + n;
  });
  if (ev.mode === 'times') {
    var L = layout(ev, S.viewTz);
    each('[data-act="daycol"]', function (el) {
      var keys = colSlots(L, L.colKeys[+el.dataset.c]), full = !!me && keys.length > 0 && keys.every(function (k) { return me.slots[k]; });
      el.classList.toggle('full', full); el.setAttribute('aria-pressed', full);
    });
  }
  paintHover();
}
function paintHover() {
  var ev = cur();
  if (!ev) return;
  var n = ev.people.length, h = S.hover, out = $('#readout');
  if (out) {
    var c = 0;
    if (h) ev.people.forEach(function (p) { if (p.slots[h.key]) c++; });
    out.textContent = h ? c + '/' + n + ' available · ' + h.label : 'Hover or tap a slot to see who is available.';
    out.classList.toggle('live', !!h);
  }
  each('[data-p]', function (li) {
    var p = ev.people[+li.dataset.p];
    if (!p) return;
    var free = h ? !!p.slots[h.key] : null, c = Object.keys(p.slots).length;
    li.classList.toggle('busy', free === false); li.classList.toggle('free', free === true);
    li.querySelector('.p-status').textContent = free === null ? c + ' ' + unit(ev, c) : free ? 'Available' : 'Unavailable';
  });
  each('.hot', function (el) { el.classList.remove('hot'); });
  if (h) { var el = $('[data-g="group"][data-k="' + h.key + '"]'); if (el) el.classList.add('hot'); }
}
function setHover(cell) {
  var key = cell ? cell.dataset.k : null;
  if ((S.hover ? S.hover.key : null) === key) return;
  S.hover = cell ? { key: key, label: cell.dataset.l } : null;
  paintHover();
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
}

/* ---------- actions ---------- */
function go(hash) { // the view follows state; the URL hash is kept in step when the browser allows it
  applyRoute(hash);
  try { if (location.hash.replace(/^#/, '') !== hash) location.hash = hash; } catch (e) {}
}
function route() {
  var h = location.hash.replace(/^#/, '');
  if (h === lastHash) return;
  if (h.indexOf('share=') === 0) {
    var target = 'new';
    if (REMOTE) toast('That link comes from the offline file and cannot be opened here.');
    else try { var ev = mergeEvent(fromCode(h.slice(6))); save(); target = 'e=' + ev.id; toast('Imported “' + ev.name + '”.'); }
    catch (e) { toast('That invite link could not be read.'); }
    try { history.replaceState(null, '', '#' + target); } catch (e2) {}
    h = target;
  }
  applyRoute(h);
}
function applyRoute(h) {
  lastHash = h;
  var id = h.indexOf('e=') === 0 ? h.slice(2) : null;
  if (REMOTE && id && /^[a-z0-9]{4,24}$/.test(id)) loadRemote(id); else showRoute(id);
}
function showRoute(id) {
  if (id && S.events.some(function (e) { return e.id === id; })) {
    if (S.curId !== id) { S.curId = id; S.me = null; token = null; S.siErr = ''; S.siName = ''; S.siPw = ''; S.hover = null; }
    S.view = 'event';
  } else S.view = 'new';
  render();
}
function createEvent() {
  var d = S.draft, days = draftDays();
  if (!days.length) S.error = d.kind === 'dates' ? 'Choose at least one date first.' : 'Choose at least one day of the week first.';
  else if (d.mode === 'times' && d.end <= d.start) S.error = 'The latest time must be after the earliest time.';
  else S.error = '';
  if (S.error) { updateDraft(); return; }
  var ev = { id: newId(), name: d.name.trim() || 'New event', kind: d.kind, mode: d.mode, days: days, start: d.start, end: d.end, tz: d.tz, created: Date.now(), people: [] };
  var opened = function (e) {
    S.draft = { name: '', kind: d.kind, mode: d.mode, days: {}, dow: {}, start: d.start, end: d.end, tz: d.tz };
    S.viewTz = LOCAL_TZ;
    go('e=' + e.id);
  };
  if (!REMOTE) { S.events.unshift(ev); save(); opened(ev); return; }
  if (creating) return;
  creating = true;
  api('POST', 'events', ev).then(function (j) {
    creating = false;
    var made = cleanEvent(j.event);
    if (!made) throw new Error('invalid');
    adopt(made); opened(made);
  }).catch(function () {
    creating = false;
    S.error = 'Could not create the event. Check that the server is still running, then try again.';
    updateDraft();
  });
}
function toggleSlots(keys) {
  var ev = cur(), me = mePerson(ev);
  if (!me) { needSignIn(); return; }
  var all = keys.every(function (k) { return me.slots[k]; });
  keys.forEach(function (k) { if (all) delete me.slots[k]; else me.slots[k] = 1; });
  me.updated = Date.now();
  saveMine(); paint();
}
function rectEach(c0, r0, c1, r1, fn) {
  for (var r = Math.min(r0, r1); r <= Math.max(r0, r1); r++) for (var c = Math.min(c0, c1); c <= Math.max(c0, c1); c++) fn(c, r);
}
function dragTo(t) {
  var d = drag;
  d.last = t;
  if (d.g === 'cal') {
    var set = Object.assign({}, d.base), i1 = +t.dataset.i;
    rectEach(d.i0 % 7, Math.floor(d.i0 / 7), i1 % 7, Math.floor(i1 / 7), function (c, r) { var k = calKeys[r * 7 + c]; if (d.adding) set[k] = 1; else delete set[k]; });
    S.draft.days = set; S.error = '';
    updateDraft();
    return;
  }
  if (d.rect) { // rectangle between where the drag started and where it is now
    var slots = Object.assign({}, d.base), L = layout(cur(), S.viewTz);
    rectEach(d.c0, d.r0, +t.dataset.c, +t.dataset.r, function (c, r) { var k = L.cells[L.colKeys[c] + '@' + L.rowMins[r]]; if (!k) return; if (d.adding) slots[k] = 1; else delete slots[k]; });
    d.me.slots = slots;
  } else if (d.adding) d.me.slots[t.dataset.k] = 1; else delete d.me.slots[t.dataset.k];
  d.me.updated = Date.now();
  paint();
}
function endDrag() {
  if (!drag) return;
  var g = drag.g;
  drag = null;
  if (g === 'mine') saveMine();
}

app.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var t = e.target.closest('[data-g="cal"],[data-g="mine"]');
  if (!t) return;
  if (t.dataset.g === 'cal') {
    var base = Object.assign({}, S.draft.days);
    drag = { g: 'cal', adding: !base[t.dataset.k], i0: +t.dataset.i, base: base };
  } else {
    var me = mePerson(cur());
    if (!me) { needSignIn(); return; }
    drag = { g: 'mine', me: me, adding: !me.slots[t.dataset.k], rect: t.dataset.c !== undefined, c0: +t.dataset.c, r0: +t.dataset.r, base: Object.assign({}, me.slots) };
  }
  e.preventDefault();
  dragTo(t);
});
window.addEventListener('pointermove', function (e) {
  if (!drag) return;
  if (e.pointerType === 'mouse' && e.buttons !== 1) { endDrag(); return; }
  var el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest ? el.closest('[data-g="' + drag.g + '"]') : null;
  if (t && t !== drag.last) dragTo(t);
});
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

app.addEventListener('pointerover', function (e) {
  var c = e.target.closest('[data-g="group"]');
  if (c) setHover(c); else if (S.hover && !e.target.closest('.group-board')) setHover(null);
});
app.addEventListener('focusin', function (e) { var c = e.target.closest('[data-g="group"]'); if (c) setHover(c); });

app.addEventListener('click', function (e) {
  var cell = e.target.closest('[data-g]');
  if (cell) { // pointer presses are handled above; this is for the keyboard
    var g = cell.dataset.g;
    if (g === 'group') setHover(cell);
    else if (e.detail === 0) {
      if (g === 'cal') { var k = cell.dataset.k; if (S.draft.days[k]) delete S.draft.days[k]; else S.draft.days[k] = 1; S.error = ''; updateDraft(); }
      else toggleSlots([cell.dataset.k]);
    }
    return;
  }
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var a = b.dataset.act, d = S.draft, t;
  if (a === 'new') go('new');
  else if (a === 'open') { e.preventDefault(); go('e=' + b.dataset.id); }
  else if (a === 'kind') { d.kind = b.dataset.v; S.error = ''; render(); }
  else if (a === 'mode') { d.mode = b.dataset.v; S.error = ''; render(); }
  else if (a === 'prev' || a === 'next') { t = new Date(Date.UTC(S.cal.y, S.cal.m + (a === 'prev' ? -1 : 1), 1)); S.cal = { y: t.getUTCFullYear(), m: t.getUTCMonth() }; render(); }
  else if (a === 'today') { t = new Date(); S.cal = { y: t.getFullYear(), m: t.getMonth() }; render(); }
  else if (a === 'clear') { if (d.kind === 'dates') d.days = {}; else d.dow = {}; S.error = ''; updateDraft(); }
  else if (a === 'dow') { if (d.dow[b.dataset.v]) delete d.dow[b.dataset.v]; else d.dow[b.dataset.v] = 1; S.error = ''; updateDraft(); }
  else if (a === 'create') createEvent();
  else if (a === 'copy') copyLink();
  else if (a === 'signout') { S.me = null; token = null; S.siErr = ''; render(); }
  else if (a === 'daycol') { var L = layout(cur(), S.viewTz); toggleSlots(colSlots(L, L.colKeys[+b.dataset.c])); }
  else if (a === 'del') {
    var id = b.dataset.id, ev = null;
    S.events.forEach(function (x) { if (x.id === id) ev = x; });
    if (ev && window.confirm(REMOTE ? 'Remove “' + ev.name + '” from this browser’s list? The event and its responses stay on the server.'
      : 'Delete “' + ev.name + '” and all of its responses from this browser? This cannot be undone.')) {
      S.events = S.events.filter(function (x) { return x.id !== id; });
      save();
      if (S.curId === id) { S.curId = null; go('new'); } else render();
    }
  }
});
app.addEventListener('change', function (e) {
  var f = e.target.dataset.field;
  if (!f) return;
  if (f === 'viewtz') { S.viewTz = e.target.value; S.hover = null; render(); return; }
  if (f === 'start') S.draft.start = +e.target.value;
  else if (f === 'end') S.draft.end = +e.target.value;
  else if (f === 'tz') S.draft.tz = e.target.value;
  S.error = '';
  updateDraft();
});
app.addEventListener('input', function (e) { // remember typed text so a refresh of the view does not lose it
  var t = e.target;
  if (t.id === 'ev-name') S.draft.name = t.value;
  else if (t.dataset.fid === 'si-name') S.siName = t.value;
  else if (t.dataset.fid === 'si-pw') S.siPw = t.value;
});
app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'ev-name') createEvent(); });
app.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target.dataset.form, el = e.target.elements;
  if (f === 'signin') signIn(el.namedItem('name').value, el.namedItem('pw').value);
  else if (f === 'import') importText(el.namedItem('code').value);
});
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', poll);

if (/^https?:$/.test(location.protocol)) { // served over the web: check whether server.js is behind this page
  api('GET', 'ping').then(function (j) { REMOTE = j.app === 'overlap'; TEMPORARY = REMOTE && j.durable === false; }, function () {}).then(function () { route(); setInterval(poll, 4000); });
} else route();
})();
</script>
</body>
</html>
